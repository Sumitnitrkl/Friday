# FRIDAY Configuration

assistant:
  name: "FRIDAY"
  wake_words:
    - "hey friday"
    - "friday"
    - "ok friday"
  personality: "warm_casual"    # FRIDAY style

voice:
  # TTS engine priority: edge_tts (online, natural neural) -> pyttsx3 (offline)
  online_engine: "edge_tts"
  offline_engine: "pyttsx3"
  # Sweet, natural female voice. Alternatives:
  #   en-US-AriaNeural   (US, friendly)
  #   en-IN-NeerjaNeural (Indian English, warm)
  #   en-GB-SoniaNeural  (British, elegant)
  edge_tts_voice: "en-US-JennyNeural"   # warm, sweet US female voice
  pyttsx3_rate: 175
  pyttsx3_volume: 1.0

speech:
  # STT engine priority: whisper (local) -> google (online fallback)
  stt_engine: "whisper"         # whisper / google / vosk
  whisper_model: "base"         # tiny / base / small / medium
  listen_timeout: 8             # seconds to wait for speech
  phrase_timeout: 3             # silence = end of phrase
  energy_threshold: 300

ai:
  # AI backend priority: online (gemini / groq / claude_api) -> ollama -> rule-based
  online_backend: "gemini"      # gemini = FREE (Google AI Studio), no credit card
  offline_backend: "ollama"
  # Gemini — FREE. Get a key at https://aistudio.google.com/apikey
  # Put the key in a .env file as GEMINI_API_KEY (keeps it out of git) — NOT here.
  gemini_model: "gemini-3.6-flash"        # current free flash model
  gemini_api_key: ""
  # Groq — also FREE (https://console.groq.com/keys)
  groq_model: "llama-3.3-70b-versatile"   # or "llama-3.1-8b-instant" (faster)
  groq_api_key: ""
  claude_model: "claude-sonnet-5"
  ollama_model: "llama3"        # run: ollama pull llama3
  max_tokens: 500
  # API keys belong in .env (gitignored): GROQ_API_KEY / ANTHROPIC_API_KEY
  claude_api_key: ""

network:
  check_url: "https://www.google.com"
  check_timeout: 3

system:
  startup_greeting: true
  speak_confirmations: true     # say "Done!" after actions
  log_level: "INFO"             # DEBUG / INFO / WARNING
  log_file: "friday.log"
