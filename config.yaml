# FRIDAY Configuration

assistant:
  name: "FRIDAY"
  wake_words:
    - "hey friday"
    - "friday"
    - "ok friday"
  followup_window: 2            # turns you can speak without repeating the wake word

voice:
  # TTS engine priority: edge_tts (online, natural neural) -> pyttsx3 (offline)
  online_engine: "edge_tts"
  offline_engine: "pyttsx3"
  # Sweet, natural female voice. Alternatives:
  #   en-US-AriaNeural   (US, friendly)
  #   en-IN-NeerjaNeural (Indian English, warm)
  #   en-GB-SoniaNeural  (British, elegant)
  edge_tts_voice: "en-US-JennyNeural"   # warm, sweet US female voice
  pyttsx3_rate: 175
  pyttsx3_volume: 1.0

speech:
  # Speech-to-text via SpeechRecognition + Google's free recognizer (needs internet)
  listen_timeout: 8             # seconds to wait for you to start speaking
  phrase_time_limit: 15         # max seconds captured per command
  energy_threshold: 300         # mic sensitivity: raise if it hears noise, lower if it misses you

ai:
  # Brain: Google Gemini with function calling (FREE at https://aistudio.google.com/apikey)
  # Put the key in .env as GEMINI_API_KEY (gitignored) — NOT here.
  # flash-lite: fast + more generous free rate limit (good for voice).
  # For smarter (but stricter-limited) replies try: gemini-2.5-flash / gemini-3.6-flash
  gemini_model: "gemini-3.5-flash-lite"
  gemini_api_key: ""
  # How FRIDAY talks + behaves. Edit freely to change her personality.
  personality: >
    You are FRIDAY, a warm, friendly, and capable AI voice assistant running on
    your creator's personal computer. Speak naturally and warmly, like a helpful
    friend. Keep replies SHORT (1-2 sentences) because they are spoken aloud.
    Never use markdown, bullet points, emojis, or special characters. When asked
    to do something on the computer, USE YOUR TOOLS to actually do it instead of
    explaining how. After a tool runs, confirm briefly and warmly. For general
    questions, just answer conversationally.

network:
  check_url: "https://www.google.com"
  check_timeout: 3

system:
  startup_greeting: true
  speak_confirmations: true     # say "Done!" after actions
  log_level: "INFO"             # DEBUG / INFO / WARNING
  log_file: "friday.log"
