# FRIDAY Configuration

assistant:
  name: "EDITH"
  wake_words:
    - "hey edith"
    - "edith"
    - "ok edith"
  # always_listening: true  -> no wake word ever; FRIDAY acts on everything it hears.
  # always_listening: false -> say a wake word, then follow-ups for a few turns.
  always_listening: true
  followup_window: 2            # (used only when always_listening is false)

voice:
  # TTS engine priority: edge_tts (online, natural neural) -> pyttsx3 (offline)
  online_engine: "edge_tts"
  offline_engine: "pyttsx3"
  # JARVIS-style British male. Compare samples in D:\FRIDAY\voice_samples, then set:
  #   en-GB-RyanNeural   (deep, measured)   en-GB-ThomasNeural (refined butler)
  #   en-GB-SoniaNeural  (British female, true EDITH)
  edge_tts_voice: "en-GB-RyanNeural"
  edge_tts_pitch: "-12Hz"   # lower = deeper / more gravitas
  edge_tts_rate:  "-6%"     # negative = slower / more measured
  pyttsx3_rate: 175
  pyttsx3_volume: 1.0

speech:
  # Speech-to-text via SpeechRecognition + Google's free recognizer (needs internet)
  listen_timeout: 8             # seconds to wait for you to start speaking
  phrase_time_limit: 15         # max seconds captured per command
  energy_threshold: 300         # mic sensitivity: raise if it hears noise, lower if it misses you

ai:
  # Brain: Google Gemini with function calling (FREE at https://aistudio.google.com/apikey)
  # Put the key in .env as GEMINI_API_KEY (gitignored) — NOT here.
  # flash-lite: fast + more generous free rate limit (good for voice).
  # For smarter (but stricter-limited) replies try: gemini-2.5-flash / gemini-3.6-flash
  gemini_model: "gemini-3.5-flash-lite"
  gemini_api_key: ""
  # How EDITH talks + behaves. Edit freely to change the personality.
  personality: >
    You are Edith, a highly capable AI assistant with full control of your creator's
    computer, in the spirit of Tony Stark's assistants. Speak calmly and precisely,
    like a refined, quietly witty British butler — confident and warm, never robotic.
    Keep spoken replies SHORT, usually one or two sentences; never use markdown,
    bullet points, emojis, or special characters. You can do ANYTHING on this
    computer: to act, USE YOUR TOOLS rather than describing steps — for general
    control use run_powershell. Be proactive and interactive: if a request is
    ambiguous, ask one brief clarifying question; after finishing a task, suggest a
    sensible next step or offer a relevant option. SAFETY: before any destructive or
    irreversible action (deleting files, shutting down, killing processes, changing
    system settings), confirm with the user first and proceed only when they clearly
    agree; if a tool reports that confirmation is needed, ask the user, then call it
    again with confirmed set to true.

security:
  # Only obey YOUR voice. Turn on, then enroll: python main.py --enroll
  voice_id: true
  # 0-1, higher = stricter. If FRIDAY ignores you, LOWER it; if it obeys others, RAISE it.
  voice_threshold: 0.80

network:
  check_url: "https://www.google.com"
  check_timeout: 3

system:
  startup_greeting: true
  speak_confirmations: true     # say "Done!" after actions
  log_level: "INFO"             # DEBUG / INFO / WARNING
  log_file: "friday.log"
